<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>트러스 도면판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: drafting board fills the left, a tabbed spec sheet sits on the right; on phones the sheet stacks below the board. */
:root {
  --paper: #eceff0;
  --sheet: #fbfcfc;
  --ink: #1b2328;
  --muted: #5b6870;
  --line: #d2d9dd;
  --grid: #e3e8eb;
  --grid-major: #c9d2d7;
  --member: #27323a;
  --accent: #c26a00;
  --accent-soft: #f7e6cc;
  --load: #b3261e;
  --ok: #24724a;
  --warn: #9a5b00;
  --bad: #b3261e;
  --ten: #1f5fa8;
  --com: #c0392b;
  --def: #7a868d;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161a; --sheet: #182026; --ink: #e2e8ec; --muted: #94a3ac; --line: #2a353d;
    --grid: #1f2930; --grid-major: #2d3a43; --member: #d3dce2; --accent: #f0a332; --accent-soft: #3b2e18;
    --load: #f07264; --ok: #5cc28a; --warn: #e2a64c; --bad: #f07264; color-scheme: dark;
    --ten: #6aa8f0; --com: #f07a6a; --def: #8b979e;
  }
}
:root[data-theme="dark"] {
  --paper: #11161a; --sheet: #182026; --ink: #e2e8ec; --muted: #94a3ac; --line: #2a353d;
  --grid: #1f2930; --grid-major: #2d3a43; --member: #d3dce2; --accent: #f0a332; --accent-soft: #3b2e18;
  --load: #f07264; --ok: #5cc28a; --warn: #e2a64c; --bad: #f07264; color-scheme: dark;
  --ten: #6aa8f0; --com: #f07a6a; --def: #8b979e;
}

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--font-ui); margin: 0; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

.app {
  display: flex; flex-direction: column; gap: 12px; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
@media (min-width: 900px) {
  .app { height: 100%; }
  .layout { flex: 1; min-height: 0; }
}

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12px/1 var(--font-num); padding: 7px 9px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--sheet); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip b { font-weight: 400; color: var(--muted); margin-right: 5px; }
.chip-btn { cursor: pointer; color: var(--ink); }
.chip-btn:hover { border-color: var(--accent); }
.chip[data-state="ok"] { border-color: var(--ok); color: var(--ok); }
.chip[data-state="warn"] { border-color: var(--warn); color: var(--warn); }
.chip[data-state="bad"] { border-color: var(--bad); color: var(--bad); }
.top .grow { flex: 1; }
.top .actions { display: flex; gap: 6px; }

.btn {
  font: 500 13px/1 var(--font-ui); height: 34px; padding: 0 12px; border: 1px solid var(--line);
  background: var(--sheet); color: var(--ink); border-radius: 7px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.42; cursor: default; }
.btn.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.btn.danger { color: var(--bad); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* ---------- main grid ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 368px; gap: 12px; }
@media (max-width: 899px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.board {
  background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
@media (max-width: 899px) { .board { height: min(66vh, 580px); min-height: 360px; } }

.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button {
  border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--ink);
  height: 32px; padding: 0 11px; font: 500 13px/1 var(--font-ui); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.seg kbd { font: 11px var(--font-num); opacity: 0.55; }
@media (max-width: 520px) { .seg kbd { display: none; } }
.tsel {
  height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--sheet); color: var(--ink);
  font: 13px var(--font-ui); padding: 0 8px;
}
.coord { margin-left: auto; font: 12px var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hintbar { padding: 6px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); min-height: 30px; }
.canvas-wrap { position: relative; flex: 1; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
#cv[data-tool="select"] { cursor: default; }

/* svg layers */
.g-minor { stroke: var(--grid); stroke-width: 1; }
.g-major { stroke: var(--grid-major); stroke-width: 1; }
.g-axis { stroke: var(--grid-major); stroke-width: 1.5; }
.mem { stroke: var(--member); stroke-width: 3; stroke-linecap: round; }
.mem.ov { stroke-dasharray: 9 5; }
.mem.sel { stroke: var(--accent); stroke-width: 5; }
.mem.bad { stroke: var(--bad); }
.node { fill: var(--sheet); stroke: var(--member); stroke-width: 2; }
.node.sel { stroke: var(--accent); stroke-width: 3.5; }
.node.pend { fill: var(--accent); stroke: var(--accent); }
.node.lone { stroke: var(--bad); }
.sup { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
.gnd { stroke: var(--ink); stroke-width: 1.5; }
.hat { stroke: var(--muted); stroke-width: 1; }
.load-l { stroke: var(--load); stroke-width: 2.2; }
.load-h { fill: var(--load); }
.rubber { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 5; }
.ghost { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; }
.lbl { font: 11px var(--font-num); fill: var(--muted); paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
.lbl-m { fill: var(--ink); }
.lbl-load { font: 500 11px var(--font-num); fill: var(--load); paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
.sc-l { stroke: var(--ink); stroke-width: 1.5; }
.sc-t { font: 11px var(--font-num); fill: var(--ink); }
.mem.ten { stroke: var(--ten); }
.mem.com { stroke: var(--com); }
.mem.zero { stroke: var(--muted); }
.mem.sel.ten, .mem.sel.com, .mem.sel.zero { stroke: var(--accent); stroke-dasharray: none; }
.an-deg { font: 600 13px var(--font-ui); paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; }
.an-deg.det { fill: var(--ok); } .an-deg.ind { fill: var(--accent); } .an-deg.mech { fill: var(--bad); }
.mem.crit-halo { stroke: var(--accent); stroke-opacity: 0.35; stroke-linecap: round; }
.defm { stroke: var(--def); stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
.defn { fill: var(--def); }
.lbl-an { font: 500 11px var(--font-num); paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
.lbl-an.ten { fill: var(--ten); } .lbl-an.com { fill: var(--com); } .lbl-an.zero { fill: var(--muted); }
.lbl-crit { font: 600 11px var(--font-ui); fill: var(--accent); paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
.rx-l { stroke: var(--ok); stroke-width: 2; } .rx-h { fill: var(--ok); }
.lbl-rx { font: 500 11px var(--font-num); fill: var(--ok); paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
.mem.plat { stroke: var(--com); stroke-dasharray: 10 4; }
.mem.base { stroke: var(--def); stroke-width: 1.6; opacity: 0.55; }
.mem.platb { stroke-dasharray: 10 4; opacity: 0.8; }
.mem.failed { stroke-width: 5; stroke-linecap: round; }
.mem.failed.f0 { stroke: var(--ten); } .mem.failed.f1 { stroke: var(--com); } .mem.failed.f2 { stroke: var(--warn); }
.badge circle { fill: var(--sheet); stroke-width: 2.2; }
.badge.f0 circle { stroke: var(--ten); } .badge.f1 circle { stroke: var(--com); } .badge.f2 circle { stroke: var(--warn); }
.badge.cas circle { stroke-width: 4; }
.badge text { font: 700 11.5px var(--font-num); fill: var(--ink); }
.mem.mechm { stroke: var(--bad); stroke-width: 2.6; }
.defm.mech { stroke: var(--bad); stroke-width: 2; stroke-dasharray: 7 4; }
.defn.mech { fill: var(--bad); }
.node.orphan { opacity: 0.35; }
.chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font: 12px var(--font-num); }
.chain .ck { border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; background: var(--paper); cursor: pointer; white-space: nowrap; }
.chain .ck:hover { border-color: var(--accent); }
.chain .ck.on { border-color: var(--accent); background: var(--accent-soft); }
.chain .ck.f0 { border-left: 4px solid var(--ten); } .chain .ck.f1 { border-left: 4px solid var(--com); } .chain .ck.f2 { border-left: 4px solid var(--warn); }
.chain .ar { color: var(--muted); }
.chain .end { color: var(--bad); font-weight: 600; }
.chain small { font-size: 11px; } .chain small.det, .chain .st.det { color: var(--ok); } .chain small.ind, .chain .st.ind { color: var(--accent); } .chain .st.mech { color: var(--bad); }
.chain .st { cursor: default; }
.mem.broken { stroke: var(--def); stroke-width: 1.4; stroke-dasharray: 3 5; opacity: 0.8; }
.xmark { stroke: var(--bad); stroke-width: 2.4; stroke-linecap: round; fill: none; }
.an-step { font: 600 13px var(--font-ui); fill: var(--ink); paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; }
.lgd { font: 12px var(--font-ui); fill: var(--muted); paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
.tip rect { fill: var(--ink); opacity: 0.92; }
.tip text { font: 12px var(--font-num); fill: var(--sheet); }
.an-banner { font: 600 13px var(--font-ui); fill: var(--bad); paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; }

/* ---------- side panel ---------- */
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button {
  flex: 1; min-width: 0; padding: 0 2px; height: 42px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font: 500 13px var(--font-ui); border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.pane { padding: 14px; overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 899px) { .pane { overflow: visible; } }
.sec { display: flex; flex-direction: column; gap: 9px; }
.sec h2 { font-size: 12px; font-weight: 600; margin: 0; letter-spacing: 0.04em; color: var(--muted); }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.title-row h3 { margin: 0; font-size: 16px; font-weight: 600; }
.title-row .sub { font: 12px var(--font-num); color: var(--muted); }
.field { display: grid; grid-template-columns: minmax(0, 1fr) 132px; align-items: center; gap: 10px; }
.field > label { color: var(--muted); font-size: 13px; }
.field input, .field select {
  height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
  font: 13px var(--font-num); padding: 0 8px; width: 100%; font-variant-numeric: tabular-nums;
}
.field select { font-family: var(--font-ui); }
.field input:disabled { opacity: 0.6; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.readout { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 3px 14px; font: 12px var(--font-num); font-variant-numeric: tabular-nums; }
.readout dt { color: var(--muted); }
.readout dd { margin: 0; text-align: right; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.issues li { padding-left: 14px; position: relative; }
.issues li::before { content: ""; position: absolute; left: 0; top: 0.55em; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.issues li[data-sev="bad"]::before { background: var(--bad); }
.issues li[data-sev="ok"]::before { background: var(--ok); }
.empty { color: var(--muted); font-size: 13px; }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.card {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px 6px; background: var(--paper);
  cursor: pointer; display: flex; flex-direction: column; gap: 4px; text-align: left; color: var(--ink); font: inherit;
}
.card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.card svg { width: 100%; height: auto; display: block; }
.card .nm { font-size: 13px; font-weight: 600; }
.card .ct { font: 11px var(--font-num); color: var(--muted); }
.sw-grid { border-collapse: collapse; font: 11px var(--font-num); }
.sw-grid th, .sw-grid td { padding: 4px 5px; text-align: right; border: 1px solid var(--line); white-space: nowrap; }
.sw-grid th { background: var(--paper); font-weight: 600; color: var(--muted); }
.sw-grid td[data-c] { cursor: pointer; }
.sw-grid td.best { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
.sw-grid td.cur { box-shadow: inset 0 0 0 2px var(--accent); }
.sw-grid td.na { color: var(--muted); text-align: center; }
.swc-l { fill: none; stroke: var(--accent); stroke-width: 1.6; } .swc-p { fill: var(--accent); }
.swc-best { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.thumb-l { stroke: var(--member); stroke-width: 1.4; stroke-linecap: round; }

textarea {
  width: 100%; min-height: 200px; font: 12px/1.45 var(--font-num); background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; white-space: pre; overflow: auto;
}
details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
details summary { cursor: pointer; font-size: 13px; font-weight: 600; }
.spec { font-size: 12px; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.spec pre { margin: 0; font: 11.5px/1.5 var(--font-num); background: var(--paper); padding: 8px; border-radius: 6px; overflow-x: auto; }
.spec table { border-collapse: collapse; width: 100%; font-size: 12px; }
.spec td { border-top: 1px solid var(--line); padding: 4px 6px 4px 0; vertical-align: top; }
.spec td:first-child { font-family: var(--font-num); white-space: nowrap; }
.tblwrap { overflow-x: auto; }

/* ---------- analysis pane ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k { font-size: 11.5px; color: var(--muted); }
.kpi .v { font: 500 17px/1.25 var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .u { font: 12px var(--font-num); color: var(--muted); margin-left: 3px; }
.kpi .s { font-size: 11.5px; color: var(--muted); }
.kpi.wide { grid-column: 1 / -1; }
.kpi[data-state="bad"] { border-color: var(--bad); }
.kpi[data-state="bad"] .v { color: var(--bad); }
.kpi[data-state="ok"] .v { color: var(--ok); }
.kpi[data-state="crit"] { border-color: var(--accent); background: var(--accent-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 5px; }
.legend .lt { border-color: var(--ten); } .legend .lc { border-color: var(--com); } .legend .ld { border-top: 2px dashed var(--def); }
.legend .lk { border-color: var(--accent); border-top-width: 6px; opacity: 0.5; }
.rtable { border-collapse: collapse; width: 100%; font: 11.5px var(--font-num); font-variant-numeric: tabular-nums; }
.rtable th { font: 600 11px var(--font-ui); color: var(--muted); text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--sheet); white-space: nowrap; cursor: pointer; user-select: none; }
.rtable th:first-child, .rtable td:first-child { text-align: left; }
.rtable th[aria-sort] { color: var(--ink); }
.rtable td { text-align: right; padding: 4px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rtable tr { cursor: pointer; }
.rtable tbody tr:hover td { background: var(--paper); }
.rtable tr.sel td { background: var(--accent-soft); }
.rtable td.ten { color: var(--ten); } .rtable td.com { color: var(--com); }
.rtable td.over { color: var(--bad); font-weight: 600; }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--line); width: 26px; vertical-align: middle; margin-left: 6px; position: relative; overflow: hidden; }
.bar b { position: absolute; inset: 0 auto 0 0; background: var(--muted); }
.bar b.hi { background: var(--accent); }
.pchart { width: 100%; height: auto; display: block; touch-action: manipulation; }
.pc-grid { stroke: var(--grid); } .pc-ax { stroke: var(--muted); stroke-width: 1.2; }
.pc-t { fill: var(--muted); font-family: var(--font-num); } .pc-l { fill: var(--muted); font-family: var(--font-ui); }
.pc-n { fill: var(--ink); font-family: var(--font-num); }
.pc-line { stroke: var(--ten); stroke-width: 2; fill: none; stroke-linejoin: round; }
.pc-drop { stroke: var(--bad); stroke-width: 1.4; stroke-dasharray: 4 3; } .pc-bad { fill: var(--bad); font: 600 11px var(--font-ui); }
.pc-ev { fill: var(--com); stroke: var(--com); stroke-width: 1.5; cursor: pointer; } .pc-ev.cas { fill: var(--sheet); stroke: var(--accent); }
details.msec > summary { cursor: pointer; list-style-position: inside; } details.msec > summary h2 { margin: 0; } .mtable td:nth-child(2) { white-space: normal; min-width: 7em; } .mtable tr[data-mat] { cursor: pointer; }
.pc-app { stroke: var(--ok); stroke-width: 1.4; stroke-dasharray: 5 4; } .pc-appt { fill: var(--ok); font-size: 10px; font-weight: 600; }
.pc-cur { fill: none; stroke: var(--accent); stroke-width: 2.4; }
.player { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.player input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.player .btn { padding: 0 10px; }
.stepcap { font: 12px var(--font-num); color: var(--muted); }
.rtwrap { overflow: auto; max-height: 340px; border: 1px solid var(--line); border-radius: 8px; }
@media (max-width: 899px) { .rtwrap { max-height: none; } }
.srcbadge { font: 500 11px var(--font-ui); padding: 3px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.srcbadge[data-src="engine"] { border-color: var(--ok); color: var(--ok); }
.srcbadge[data-src="stale"] { border-color: var(--warn); color: var(--warn); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--sheet); padding: 9px 14px; border-radius: 8px; font-size: 13px;
  opacity: 0; transition: opacity 0.18s; pointer-events: none; max-width: calc(100% - 32px); z-index: 20;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <header class="top">

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const svg = $('#cv');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (v) => (v === 0 ? 0 : v); // full double precision; JS prints the shortest round-trip form
const fmt = (v, d = 2) => (Number.isFinite(v) ? (Math.abs(v) >= 1e5 || (Math.abs(v) < 1e-3 && v !== 0) ? v.toExponential(3) : (+v.toFixed(d)).toString()) : '—');
const coarse = window.matchMedia('(pointer: coarse)').matches;

function evalExpr(src) {
  const str = String(src).replace(/[−–]/g, '-').replace(/×/g, '*').replace(/÷/g, '/').replace(/,/g, '').trim();
  if (!str) return NaN;
  let i = 0;
  const FN = { sqrt: Math.sqrt, sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos, atan: Math.atan, abs: Math.abs, rad: (d) => d * Math.PI / 180, deg: (r) => r * 180 / Math.PI };
  const ws = () => { while (str[i] === ' ') i++; };
  const fail = () => { throw new Error('bad expression'); };
  function primary() {
    ws();
    if (str[i] === '(') { i++; const v = expr(); ws(); if (str[i] !== ')') fail(); i++; return v; }
    const mnum = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(str.slice(i));
    if (mnum) { i += mnum[0].length; return parseFloat(mnum[0]); }
    const mid = /^[A-Za-z]+/.exec(str.slice(i));
    if (mid) {
      i += mid[0].length; const name = mid[0].toLowerCase();
      if (name === 'pi') return Math.PI;
      if (!FN[name]) fail();
      ws(); if (str[i] !== '(') fail(); i++;
      const v = expr(); ws(); if (str[i] !== ')') fail(); i++;
      return FN[name](v);
    }
    return fail();
  }
  function unary() { ws(); if (str[i] === '-') { i++; return -unary(); } if (str[i] === '+') { i++; return unary(); } return power(); }
  function power() { const b = primary(); ws(); if (str[i] === '^') { i++; return Math.pow(b, unary()); } return b; }
  function term() { let v = unary(); for (;;) { ws(); if (str[i] === '*') { i++; v *= unary(); } else if (str[i] === '/') { i++; v /= unary(); } else return v; } }
  function expr() { let v = term(); for (;;) { ws(); if (str[i] === '+') { i++; v += term(); } else if (str[i] === '-') { i++; v -= term(); } else return v; } }
  try { const v = expr(); ws(); return i === str.length ? v : NaN; } catch (e) { return NaN; }
}

/* ======================= model ======================= */
let uidSeq = 1;
const nuid = () => uidSeq++;

// 대표값 (E, σ: MPa / ρ: g/cm³). 등급·제조사·함수율에 따라 문헌 범위가 넓다. 금속은 σₜ = σ꜀ = 항복강도.
// 목재는 결 방향 값. 빨대 실측값(ppm)만 3절 실험값이고 나머지는 문헌 대표값이다.
const MATERIALS = {
  pp:     { grp: '플라스틱', label: 'PP 빨대 (문헌값)', E: 1500, rho: 0.905, st: 30, sc: 40 },
  ppm:    { grp: '플라스틱', label: 'PP 빨대 (실측 E = 1630)', E: 1630, rho: 0.905, st: 30, sc: 40 },
  hdpe:   { grp: '플라스틱', label: 'HDPE (고밀도 폴리에틸렌)', E: 1000, rho: 0.95, st: 25, sc: 25 },
  ps:     { grp: '플라스틱', label: 'PS (폴리스티렌)', E: 3200, rho: 1.05, st: 45, sc: 90 },
  pet:    { grp: '플라스틱', label: 'PET (페트병)', E: 2800, rho: 1.38, st: 55, sc: 80 },
  pla:    { grp: '플라스틱', label: 'PLA (3D 프린팅)', E: 3500, rho: 1.24, st: 50, sc: 60 },
  abs:    { grp: '플라스틱', label: 'ABS', E: 2200, rho: 1.05, st: 40, sc: 60 },
  pvc:    { grp: '플라스틱', label: '경질 PVC', E: 3000, rho: 1.40, st: 50, sc: 65 },
  pmma:   { grp: '플라스틱', label: '아크릴 (PMMA)', E: 3000, rho: 1.18, st: 70, sc: 100 },
  nylon:  { grp: '플라스틱', label: '나일론 6', E: 2500, rho: 1.14, st: 70, sc: 70 },
  balsa:  { grp: '목재·종이·식품', label: '발사목', E: 3200, rho: 0.16, st: 19, sc: 12 },
  pine:   { grp: '목재·종이·식품', label: '소나무', E: 10000, rho: 0.50, st: 80, sc: 40 },
  birch:  { grp: '목재·종이·식품', label: '자작나무 (이쑤시개·나무젓가락)', E: 13000, rho: 0.65, st: 100, sc: 50 },
  bamboo: { grp: '목재·종이·식품', label: '대나무', E: 15000, rho: 0.70, st: 120, sc: 55 },
  paper:  { grp: '목재·종이·식품', label: '종이 빨대 (판지)', E: 3000, rho: 0.70, st: 30, sc: 15 },
  pasta:  { grp: '목재·종이·식품', label: '스파게티 면 (건조)', E: 3500, rho: 1.50, st: 15, sc: 15 },
  al:     { grp: '금속', label: '알루미늄 6061-T6', E: 69000, rho: 2.70, st: 276, sc: 276 },
  steel:  { grp: '금속', label: '구조용 강 (SS275)', E: 205000, rho: 7.85, st: 275, sc: 275 },
  sus:    { grp: '금속', label: '스테인리스 304', E: 193000, rho: 8.00, st: 215, sc: 215 },
  cu:     { grp: '금속', label: '구리 (연질)', E: 117000, rho: 8.96, st: 70, sc: 70 },
  ti:     { grp: '금속', label: '티타늄 Ti-6Al-4V', E: 114000, rho: 4.43, st: 880, sc: 880 },
  cfrp:   { grp: '복합재', label: '탄소섬유 (CFRP, 일방향)', E: 135000, rho: 1.60, st: 1500, sc: 1200 },
  gfrp:   { grp: '복합재', label: '유리섬유 (GFRP, 일방향)', E: 40000, rho: 1.90, st: 1000, sc: 600 },
  custom: { grp: '', label: '직접 입력' },
};
function matSelectField(id, value, attrs) {
  const groups = [];
  for (const [k, v] of Object.entries(MATERIALS)) { let g = groups.find((x) => x.name === v.grp); if (!g) groups.push(g = { name: v.grp, items: [] }); g.items.push([k, v.label]); }
  const opt = ([k, l]) => `<option value="${k}"${k === value ? ' selected' : ''}>${esc(l)}</option>`;
  return `<div class="field"><label for="${id}">재료</label><select id="${id}" ${attrs}>${groups.map((g) => g.name ? `<optgroup label="${esc(g.name)}">${g.items.map(opt).join('')}</optgroup>` : g.items.map(opt).join('')).join('')}</select></div>`;
}
// 값이 목록의 재료와 똑같으면 그 재료로 본다 (불러온 파일은 preset 정보가 없음)
const matchPreset = (mat) => Object.keys(MATERIALS).find((k) => k !== 'custom' && ['E', 'rho', 'st', 'sc'].every((q) => MATERIALS[k][q] === mat[q])) || 'custom';
const matName = (mat) => { const k = matchPreset(mat); return k === 'custom' ? '직접 입력' : MATERIALS[k].label; };
const SHAPES = { tube: '중공 원형', rod: '원형', square: '정사각형', custom: 'A · I 직접 입력' };
const KINDS = { warren: 'Warren', pratt: 'Pratt', howe: 'Howe', k: 'K-truss' };
// 실제 다리에서 쓰이는 형식 (하현재 통과식, 하중은 하현재 중앙). ratio = 흔히 쓰는 높이/스팬 비 (중앙 기준)
const BRIDGES = { warrenv: '수직재 Warren', parker: 'Parker', bowstring: 'Bowstring (활형)', lattice: '격자형 (Double Warren)' };
const BRIDGE_INFO = {
  warrenv: { ratio: 1 / 8, t: '삼각형 사재 사이에 수직재를 넣어 바닥판 하중을 패널마다 나눠 받습니다. 철도·도로 강트러스교에 흔한 형식입니다.' },
  parker: { ratio: 1 / 6, t: '상현재가 가운데로 갈수록 높아지는 Pratt입니다. 휨모멘트가 큰 중앙을 깊게 해서 장경간 강트러스교에 많이 쓰였습니다.' },
  bowstring: { ratio: 1 / 6, t: '상현재가 포물선 아치이고 하현재가 활시위처럼 묶습니다. 분포하중에서는 상현재 축력이 고르게 되는 형식입니다.' },
  lattice: { ratio: 1 / 8, t: '사재가 패널마다 X자로 겹칩니다(교차점은 연결하지 않음). 19세기 목재·연철 다리에 쓰인 부정정 형식입니다.' },
};
const KIND_LABEL = { ...KINDS, ...BRIDGES, tri: '기본 삼각형' };
// 3절 실험 빨대: 외경 5 mm, 길이 180 mm, 질량 0.34 g, ρ 0.905 → t = (d − √(d² − 4000m/(πρL)))/2
const EXP_STRAW = { d_o: 5, t: 0.1366 };

const defMat = () => ({ preset: 'pp', E: 1500, rho: 0.905, st: 30, sc: 40 });
const defConsts = () => ({ g: 9.80665, piMode: 'exact', pi: 3.14, tol: 1e-12 });
const defSec = () => ({ shape: 'tube', d_o: 6, t: 0.15, d: 3, b: 3, A: 2.757, I: 11.80 });

function secProps(s) {
  if (s.shape === 'tube') {
    const di = s.d_o - 2 * s.t;
    if (!(s.d_o > 0) || !(s.t > 0) || di < 0) return { A: NaN, I: NaN, err: '두께는 외경의 절반 이하여야 합니다' };
    const q = Math.PI * s.t * (s.d_o - s.t); // = pi/4 (do^2 - di^2), factored to avoid subtractive cancellation
    return { A: q, I: q * (s.d_o ** 2 + di ** 2) / 16 };
  }
  if (s.shape === 'rod') {
    if (!(s.d > 0)) return { A: NaN, I: NaN, err: '지름은 0보다 커야 합니다' };
    return { A: Math.PI / 4 * s.d ** 2, I: Math.PI / 64 * s.d ** 4 };
  }
  if (s.shape === 'square') {
    if (!(s.b > 0)) return { A: NaN, I: NaN, err: '한 변은 0보다 커야 합니다' };
    return { A: s.b ** 2, I: s.b ** 4 / 12 };
  }
  if (!(s.A > 0) || !(s.I > 0)) return { A: NaN, I: NaN, err: 'A와 I는 0보다 커야 합니다' };
  return { A: s.A, I: s.I };
}

let S = null; // design state
const UI = { tool: 'select', sel: null, pend: null, view: { cx: 300, cy: 50, s: 1.2 }, grid: 10, labels: 'n', fmt: 'json', tab: 'props', hover: null, an: { base: 'def', show: 'N', def: 'auto', react: true, sort: 'idx', digits: 4, mono: false, nodes: true, post: 'remove' }, step: null, hoverMem: null, imported: null, preset: { kind: 'warren', n: 6, L: 600, H: 100, P: 10, tri: { L: 200, H: 100 * Math.SQRT2, P: 10 } } };
const hist = { undo: [], redo: [] };

const nmap = () => new Map(S.nodes.map((n) => [n.uid, n]));
const nodeIndex = () => new Map(S.nodes.map((n, i) => [n.uid, i]));
const memEff = (m) => {
  const mat = m.ov ? m.ov.mat : S.mat, sec = m.ov ? m.ov.sec : S.sec, K = m.ov ? m.ov.K : S.K;
  const sp = secProps(sec);
  return { E: mat.E, rho: mat.rho, st: mat.st, sc: mat.sc, A: sp.A, I: sp.I, K, err: sp.err };
};
const memLen = (m, nm) => { const a = nm.get(m.a), b = nm.get(m.b); return Math.hypot(b.x - a.x, b.y - a.y); };

/* ---------- presets (경사 단주형: 좌측 하단 핀, 우측 하단 롤러, 중앙 하단 집중하중) ---------- */
function generate(kind, n, L, H, P) {
  if (kind === 'tri') {
    return {
      nodes: [{ x: 0, y: 0, sx: 1, sy: 1, fx: 0, fy: 0 }, { x: L, y: 0, sx: 0, sy: 1, fx: 0, fy: 0 }, { x: L / 2, y: H, sx: 0, sy: 0, fx: 0, fy: -Math.abs(P) }],
      mem: [[0, 1], [0, 2], [1, 2]],
    };
  }
  const half = n / 2;
  const X = (k) => k * L / n; // multiply first so that panel points stay exact
  const nodes = [], idx = new Map(), mem = [];
  const add = (k, x, y) => { idx.set(k, nodes.length); nodes.push({ x, y, sx: 0, sy: 0, fx: 0, fy: 0 }); };
  const e = (a, b) => mem.push([idx.get(a), idx.get(b)]);
  const B = (k) => 'B' + k, T = (k) => 'T' + k, M = (k) => 'M' + k;
  for (let k = 0; k <= n; k++) add(B(k), X(k), 0);
  if (kind === 'warren') {
    for (let k = 0; k < n; k++) add(T(k), (2 * k + 1) * L / (2 * n), H);
    for (let k = 0; k < n; k++) e(B(k), B(k + 1));
    for (let k = 0; k < n - 1; k++) e(T(k), T(k + 1));
    for (let k = 0; k < n; k++) { e(T(k), B(k)); e(T(k), B(k + 1)); }
  } else if (kind === 'warrenv') {
    for (let k = 1; k < n; k++) add(T(k), X(k), H);
    for (let k = 0; k < n; k++) e(B(k), B(k + 1));
    for (let k = 1; k < n - 1; k++) e(T(k), T(k + 1));
    for (let k = 1; k < n; k++) e(T(k), B(k));
    for (let k = 0; k < n; k++) { if (k % 2 === 0) e(B(k), T(k + 1)); else e(T(k), B(k + 1)); }
  } else if (kind === 'lattice') {
    for (let k = 0; k <= n; k++) add(T(k), X(k), H);
    for (let k = 0; k < n; k++) { e(B(k), B(k + 1)); e(T(k), T(k + 1)); }
    e(B(0), T(0)); e(B(n), T(n));
    for (let k = 0; k < n; k++) { e(B(k), T(k + 1)); e(T(k), B(k + 1)); }
  } else if (kind === 'pratt' || kind === 'howe' || kind === 'parker' || kind === 'bowstring') {
    // Parker: 상현재 높이 H(1 − 0.4(1 − 2k/n)²), Bowstring: 포물선 4Hk(n − k)/n²
    const hAt = (k) => (kind === 'parker' ? H * (1 - 0.4 * (1 - 2 * k / n) ** 2) : kind === 'bowstring' ? 4 * H * k * (n - k) / (n * n) : H);
    for (let k = 1; k < n; k++) add(T(k), X(k), hAt(k));
    for (let k = 0; k < n; k++) e(B(k), B(k + 1));
    for (let k = 1; k < n - 1; k++) e(T(k), T(k + 1));
    e(B(0), T(1)); e(B(n), T(n - 1));
    for (let k = 1; k < n; k++) e(T(k), B(k));
    for (let k = 1; k < n - 1; k++) {
      const left = k < half;
      if (kind !== 'howe') { if (left) e(T(k), B(k + 1)); else e(T(k + 1), B(k)); }
      else { if (left) e(T(k + 1), B(k)); else e(T(k), B(k + 1)); }
    }
  } else {
    for (let k = 1; k < n; k++) { add(T(k), X(k), H); add(M(k), X(k), H / 2); }
    for (let k = 0; k < n; k++) e(B(k), B(k + 1));
    for (let k = 1; k < n - 1; k++) e(T(k), T(k + 1));
    e(B(0), T(1)); e(B(n), T(n - 1));
    for (let k = 1; k < n; k++) { e(T(k), M(k)); e(M(k), B(k)); }
    for (let k = 1; k < n - 1; k++) {
      if (k < half) { e(T(k), M(k + 1)); e(B(k), M(k + 1)); }
      else { e(T(k + 1), M(k)); e(B(k + 1), M(k)); }
    }
    e(B(0), M(1)); e(B(n), M(n - 1));
  }
  const n0 = nodes[idx.get(B(0))], nn = nodes[idx.get(B(n))], nc = nodes[idx.get(B(half))];
  n0.sx = 1; n0.sy = 1; nn.sy = 1; nc.fy = -Math.abs(P);
  return { nodes, mem };
}

function loadGenerated(g, meta) {
  S.nodes = g.nodes.map((n) => ({ uid: nuid(), ...n }));
  S.members = g.mem.map(([a, b]) => ({ uid: nuid(), a: S.nodes[a].uid, b: S.nodes[b].uid, ov: null }));
  S.meta = meta;
  UI.sel = null; UI.pend = null;
}

/* ======================= history & persistence ======================= */
const snap = () => JSON.stringify({ nodes: S.nodes, members: S.members, mat: S.mat, sec: S.sec, K: S.K, meta: S.meta, consts: S.consts });
function restore(json) {
  const d = typeof json === 'string' ? JSON.parse(json) : json;
  S = { nodes: d.nodes || [], members: d.members || [], mat: d.mat || defMat(), sec: d.sec || defSec(), K: d.K ?? 1, meta: d.meta || { name: 'truss' }, consts: { ...defConsts(), ...(d.consts || {}) } };
  let mx = 0;
  for (const n of S.nodes) mx = Math.max(mx, n.uid);
  for (const m of S.members) mx = Math.max(mx, m.uid);
  uidSeq = mx + 1;
  const nm = nmap();
  if (UI.sel && !(UI.sel.type === 'node' ? nm.has(UI.sel.uid) : S.members.some((m) => m.uid === UI.sel.uid))) UI.sel = null;
  if (UI.pend && !nm.has(UI.pend)) UI.pend = null;
}
function mutate(fn) {
  hist.undo.push(snap());
  if (hist.undo.length > 300) hist.undo.shift();

function inspect() {
  const nm = nmap();
  const j = S.nodes.length, m = S.members.length;
  const r = S.nodes.reduce((a, n) => a + (n.sx ? 1 : 0) + (n.sy ? 1 : 0), 0);
  const deg = m + r - 2 * j;
  let len = 0, mass = 0, massOk = true;
  const degree = new Map(S.nodes.map((n) => [n.uid, 0]));
  const zero = [];
  const secErr = new Set();
  let matErr = false;
  S.members.forEach((mb, k) => {
    degree.set(mb.a, degree.get(mb.a) + 1); degree.set(mb.b, degree.get(mb.b) + 1);
    const L = memLen(mb, nm); len += L;

    if (p.err) { secErr.add(p.err); massOk = false; } else mass += p.rho * p.A * L / 1000;
    if (!(p.E > 0 && p.rho > 0 && p.st > 0 && p.sc > 0 && p.K > 0)) matErr = true;
  });

  const lone = S.nodes.filter((n) => degree.get(n.uid) === 0).map((n) => idx.get(n.uid));
  const dangling = S.nodes.filter((n) => degree.get(n.uid) === 1).map((n) => idx.get(n.uid));
  const seen = new Map(), dup = [];
  for (const n of S.nodes) {
    const key = n.x.toFixed(6) + ',' + n.y.toFixed(6);
    if (seen.has(key)) dup.push(idx.get(n.uid)); else seen.set(key, true);
  }
  const loads = S.nodes.filter((n) => n.fx || n.fy).length;
  const issues = [];
  const list = (a) => a.slice(0, 6).map((i) => '#' + i).join(', ') + (a.length > 6 ? ' 외' : '');
  if (!j) issues.push({ sev: 'bad', t: '절점이 없습니다. 프리셋을 고르거나 절점 도구로 그려 보세요.' });
  if (j && !r) issues.push({ sev: 'bad', t: '지점이 없습니다. 절점을 선택해 핀 또는 롤러를 지정하세요.' });
  else if (j && r < 3) issues.push({ sev: 'bad', t: `지점 반력이 ${r}개입니다. 3개 이상이어야 구조물 전체가 움직이지 않습니다.` });
  if (j && deg < 0) issues.push({ sev: 'bad', t: `부재가 ${-deg}개 부족합니다 (m + r − 2j < 0). 불안정한 구조입니다.` });
  if (lone.length) issues.push({ sev: 'bad', t: `연결되지 않은 절점: ${list(lone)}` });
  if (dangling.length) issues.push({ sev: 'bad', t: `부재가 하나뿐인 절점: ${list(dangling)} (그 방향으로 지지되지 않습니다)` });
  if (zero.length) issues.push({ sev: 'bad', t: `길이가 0인 부재: ${list(zero)}` });
  for (const t of secErr) issues.push({ sev: 'bad', t: '단면 값 오류: ' + t });
  if (matErr) issues.push({ sev: 'bad', t: 'E, ρ, σₜ, σ꜀, K는 모두 0보다 커야 합니다.' });
  if (dup.length) issues.push({ sev: 'warn', t: `다른 절점과 위치가 겹치는 절점: ${list(dup)}` });
  if (j && !loads) issues.push({ sev: 'warn', t: '하중이 없습니다. 하중을 받을 절점을 선택해 Fy를 입력하세요.' });
  return { j, m, r, deg, len, mass: massOk ? mass : NaN, issues };
}
function degLabel(deg, j) {
  if (!j) return { t: '—', st: '' };

// d = exportData() 형식. 반환: RESULT 1 과 같은 필드.
function solveTruss(d, cst) {
  const PI = cst && Number.isFinite(cst.pi) ? cst.pi : Math.acos(-1);   // solve.cpp: std::acos(-1.0)
  const TOL = cst && Number.isFinite(cst.tol) ? cst.tol : 1e-12;         // solve.cpp: 1e-12

    const dofs = [2 * e.i, 2 * e.i + 1, 2 * e.j, 2 * e.j + 1];

  N.forEach((nd, k) => { F[2 * k] = nd.fx; F[2 * k + 1] = nd.fy; });
  // 함수 6·7: 자유 자유도
  const free = [];
  N.forEach((nd, k) => { if (nd.fix_x === 0) free.push(2 * k); if (nd.fix_y === 0) free.push(2 * k + 1); });
  const m = free.length;
  const A = free.map((p) => Float64Array.from(free, (q) => K[p][q]));
  const b = free.map((p) => F[p]);

  const x = new Array(m).fill(0);

  let ok = !(m > 0 && scale === 0);
  const tol = TOL * scale;
  for (let col = 0; ok && col < m; col++) {
    let piv = col;
    for (let rr = col + 1; rr < m; rr++) if (Math.abs(A[rr][col]) > Math.abs(A[piv][col])) piv = rr;
    if (Math.abs(A[piv][col]) < tol) { ok = false; break; }

      const f = A[rr][col] / A[col][col];

    let sum = b[i];
    for (let k = i + 1; k < m; k++) sum -= A[i][k] * x[k];

  }
  // 단계 D: 변위
  const u = new Float64Array(n);
  free.forEach((p, q) => { u[p] = x[q]; });
  for (let k = 0; k < j; k++) { r.ux.push(u[2 * k]); r.uy.push(u[2 * k + 1]); }

  const Ku = new Float64Array(n);
  for (let a = 0; a < n; a++) { let s = 0; for (let c = 0; c < n; c++) s += K[a][c] * u[c]; Ku[a] = s; }
  N.forEach((nd, k) => {

    const Nf = e.E * e.A / g.L * dL;

  if (r.mass > 0) r.eta = r.Pfail / r.mass;
  r.status = 0;

}

      if (!sel) style = ` style="stroke-width:${(1.6 + 5.4 * (nMax > 0 ? Math.abs(N) / nMax : 0)).toFixed(2)}"`;
    } else if (m.ov) cls += ' ov';
    out.push(`<line class="${cls}${sel ? ' sel' : ''}${bad ? ' bad' : ''}"${style} x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`);
  });

  // rubber band
  if (UI.tool === 'member' && UI.pend && UI.hover) {
    const a = nm.get(UI.pend);
    if (a) {
      const [x1, y1] = toS(...wp(a));
      const h = UI.hover.node ? nm.get(UI.hover.node) : null;
      const [x2, y2] = h ? toS(h.x, h.y) : toS(UI.hover.x, UI.hover.y);
      out.push(`<line class="rubber" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);
    }
  }
  // ghost node preview
  if ((UI.tool === 'node' || UI.tool === 'member') && UI.hover && !UI.hover.node && !coarse) {
    const [gx, gy] = toS(UI.hover.x, UI.hover.y);
    out.push(`<circle class="ghost" cx="${gx}" cy="${gy}" r="6"/>`);
  }

  // supports
  for (const n of S.nodes) {
    if (!n.sx && !n.sy) continue;
    const [px, py] = toS(...wp(n));
    out.push(supportGlyph(px, py, n.sx, n.sy));
  }
  // loads
  for (const n of S.nodes) {
    if (!n.fx && !n.fy) continue;
    const [px, py] = toS(...wp(n));
    const mag = Math.hypot(n.fx, n.fy);
    const dx = n.fx / mag, dy = -n.fy / mag; // screen direction
    const tipX = px - dx * 9, tipY = py - dy * 9;
    const tailX = tipX - dx * 46, tailY = tipY - dy * 46;
    const hx = tipX - dx * 10, hy = tipY - dy * 10, ox = -dy * 5, oy = dx * 5;
    out.push(`<line class="load-l" x1="${tailX}" y1="${tailY}" x2="${hx}" y2="${hy}"/>`);
    out.push(`<polygon class="load-h" points="${tipX},${tipY} ${hx + ox},${hy + oy} ${hx - ox},${hy - oy}"/>`);
    const txt = n.fx ? `(${fmt(n.fx)}, ${fmt(n.fy)}) N` : `${fmt(Math.abs(n.fy))} N`;
    out.push(`<text class="lbl-load" x="${tailX + 6}" y="${tailY - 4}">${txt}</text>`);
  }

  // reactions (analysis)
  if (R && UI.an.react && R.rx) {
    S.nodes.forEach((n, i) => {
      const comps = [];
      if (n.sx && Math.abs(R.rx[i]) > 1e-9 * Math.max(1, nMax)) comps.push([R.rx[i], 0]);
      if (n.sy && Math.abs(R.ry[i]) > 1e-9 * Math.max(1, nMax)) comps.push([0, R.ry[i]]);
      const [px, py] = toS(...wp(n));
      comps.forEach(([fx, fy]) => {
        const mag = Math.hypot(fx, fy), dx = fx / mag, dy = -fy / mag;
        // 반력 화살표는 지점 기호 바깥에서 절점 쪽으로
        const tipX = px - dx * 32, tipY = py - dy * 32;
        const tailX = tipX - dx * 30, tailY = tipY - dy * 30;
        const hx = tipX - dx * 8, hy = tipY - dy * 8, ox = -dy * 4, oy = dx * 4;
        out.push(`<line class="rx-l" x1="${tailX}" y1="${tailY}" x2="${hx}" y2="${hy}"/><polygon class="rx-h" points="${tipX},${tipY} ${hx + ox},${hy + oy} ${hx - ox},${hy - oy}"/>`);
        out.push(`<text class="lbl-rx" x="${tailX + (fx ? 0 : 6)}" y="${tailY + (fx ? -6 : 12)}" text-anchor="${fx ? 'middle' : 'start'}">${fmt(mag, 3)} N</text>`);
      });
    });
  }

  // nodes
  S.nodes.forEach((n) => {
    const [px, py] = toS(...wp(n));
    const sel = UI.sel && UI.sel.type === 'node' && UI.sel.uid === n.uid;
    const pend = UI.pend === n.uid;
    const lone = degree.get(n.uid) === 0;
    const orphan = R && R.frame && !S.members.some((m, k) => alive(k) && (m.a === n.uid || m.b === n.uid));
    out.push(`<circle class="node${sel ? ' sel' : ''}${pend ? ' pend' : ''}${lone ? ' lone' : ''}${orphan ? ' orphan' : ''}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${sel ? 6.5 : 5}"/>`);
  });

  // labels
  if (UI.labels !== 'none') {
    S.nodes.forEach((n) => {
      const [px, py] = toS(...wp(n));
      out.push(`<text class="lbl" x="${(px + 7).toFixed(1)}" y="${(py - 8).toFixed(1)}">${idx.get(n.uid)}</text>`);
    });
  }
  if (overview) {
    CL.events.forEach((e, i) => {
      const m = S.members[e.member], a = nm.get(m.a), b = nm.get(m.b);
      const [px, py] = toS(...midp(a, b));
      out.push(`<g class="badge f${e.mode}${e.cascade ? ' cas' : ''}"><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="10"/><text x="${px.toFixed(1)}" y="${(py + 4).toFixed(1)}" text-anchor="middle">${i + 1}</text></g>`);
    });
  }
  if (R && UI.an.show !== 'none' && !isMech) {
    S.members.forEach((m, k) => {
      const a = nm.get(m.a), b = nm.get(m.b), q = R.members[k];
      if (q.state === 1) return;
      const [sx1, sy1] = toS(...wp(a)), [sx2, sy2] = toS(...wp(b));
      if (Math.hypot(sx2 - sx1, sy2 - sy1) < 52 && k !== R.critical) return; // 너무 짧게 보이면 숫자를 생략 (확대하면 나타남)
      const [px, py] = toS(...midp(a, b));
      const kind = ZERO_N(q.N, nMax) ? 'zero' : q.N > 0 ? 'ten' : 'com';
      const t = UI.an.show === 'N' ? (kind === 'zero' ? '0' : sigf(q.N, UI.an.digits)) : UI.an.show === 'dcr' ? sigf(q.dcr, UI.an.digits) : 'm' + k;
      out.push(`<text class="lbl-an ${kind}" x="${px.toFixed(1)}" y="${(py + 4).toFixed(1)}" text-anchor="middle">${t}</text>`);
    });
    if (R.critical >= 0) {
      const m = S.members[R.critical], a = nm.get(m.a), b = nm.get(m.b);
      const [x1, y1] = toS(...wp(a)), [x2, y2] = toS(...wp(b));
      const len = Math.hypot(x2 - x1, y2 - y1) || 1;
      let nx = -(y2 - y1) / len, ny = (x2 - x1) / len;   // 부재에 수직인 화면 방향
      if (ny > 0) { nx = -nx; ny = -ny; }                 // 위쪽으로
      const off = 13 + 26 * Math.abs(nx);                 // 기운 부재일수록 글자 폭만큼 더 띄운다
      const lx = (x1 + x2) / 2 + nx * off, ly = (y1 + y2) / 2 + ny * off + 4;
      const evq = R.frame ? CL.events[R.frame.ev] : null;
      const ctext = evq ? `파괴 ${R.frame.ev + 1}: m${evq.member} ${MODE_LABEL[evq.mode]}${evq.cascade ? ' (연쇄)' : ''}` : `최초 파괴 · ${MODE_LABEL[R.members[R.critical].mode]}`;
      out.push(`<text class="lbl-crit" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${ctext}</text>`);
    }
  } else if (UI.labels === 'nm') {
    S.members.forEach((m, k) => {
      const a = nm.get(m.a), b = nm.get(m.b);
      const [px, py] = toS(...midp(a, b));
      out.push(`<text class="lbl lbl-m" x="${px.toFixed(1)}" y="${(py + 4).toFixed(1)}" text-anchor="middle">m${k}</text>`);
    });
  }

  // scale bar
  const target = 110 / v.s;
  const pow = Math.pow(10, Math.floor(Math.log10(target)));
  let sl = pow;
  for (const f of [1, 2, 5, 10]) if (f * pow <= target) sl = f * pow;
  const sp = sl * v.s, bx = 14, by = H - 16;
  out.push(`<line class="sc-l" x1="${bx}" y1="${by}" x2="${bx + sp}" y2="${by}"/><line class="sc-l" x1="${bx}" y1="${by - 5}" x2="${bx}" y2="${by + 3}"/><line class="sc-l" x1="${bx + sp}" y1="${by - 5}" x2="${bx + sp}" y2="${by + 3}"/>`);
  out.push(`<text class="sc-t" x="${bx + sp + 8}" y="${by + 4}">${fmt(sl, 3)} mm</text>`);

  if (anOn && shown && shown.res) {
    const st = shown.res.status;
    const msg = st === 1 ? '불안정 구조 (메커니즘) — 강성행렬이 특이합니다' : st === 'blocked' ? '해석할 수 없는 값이 있습니다 (해석 탭 참고)' : st === 'big' ? '절점이 많아 자동 해석을 멈췄습니다' : '';
    if (msg) out.push(`<text class="an-banner" x="14" y="24">${msg}</text>`);
    if (R && defScale(R) > 0) out.push(`<text class="sc-t" x="${W - 12}" y="${H - 12}" text-anchor="end">변형 ×${fmt(defScale(R), 3)}</text>`);
    if (R) {   // 지금 위상의 정정 여부 (단계 보기에서는 단계마다 바뀐다)
      const ts = topoStatus(R.frame || null);
      const y0 = R.frame ? (isMech ? 70 : 48) : 24;
      out.push(`<text class="an-deg ${ts.cls}" x="14" y="${y0}">${R.frame ? '현재 구조: ' : '구조: '}${ts.label}</text>`);
      out.push(`<text class="sc-t" x="14" y="${y0 + 17}">${ts.eq}${ts.plat ? ` (좌굴 유지 ${ts.plat}개는 강성이 없어 제외)` : ''}${ts.mech && ts.deg >= 0 ? ' — 부재 수는 충분하지만 배치 때문에 움직입니다' : ''}</text>`);
    }
    if (R && R.frame) {
      const f = R.frame, nF = CL.frames.length;
      const gone = R.members.filter((q) => q.state === 1).length;
      const what = f.kind === 'start' ? '하중 0' : f.kind === 'event' ? `파괴 ${f.ev + 1} 직전` : f.kind === 'mech' ? '붕괴 모드' : `파괴 ${f.ev + 1} 직후 (힘 재분배)`;
      out.push(`<text class="an-step" x="14" y="24">단계 ${UI.step}/${nF - 1} · ${what} · P = ${sigf(f.P, UI.an.digits)} N (지금 하중의 ×${sigf(f.lam, Math.max(5, UI.an.digits))}) · 남은 부재 ${S.members.length - gone}/${S.members.length}</text>`);
      if (f.kind === 'mech') out.push(`<text class="an-banner" x="14" y="46">메커니즘: 빨간 형상처럼 움직이며 무너집니다 (움직임의 크기는 임의)</text>`);
    }
    if (overview) {
      out.push(`<text class="an-step" x="14" y="24">연쇄 파괴 전체 순서 · ${CL.events.length}회 · 최초 ${sigf(CL.events[0].P, UI.an.digits)} N → ${CL.end === 'mechanism' ? '붕괴' : '마지막'} ${sigf(CL.lamUlt * CL.Fmag, UI.an.digits)} N</text>`);
      const items = [['f1', '좌굴'], ['f0', '인장 파단'], ['f2', '압괴']].filter(([c]) => CL.events.some((e) => 'f' + e.mode === c));
      let lx = 14; const ly = H - 40;
      for (const [c, t] of items) { out.push(`<line class="mem failed ${c}" style="stroke-width:4" x1="${lx}" y1="${ly}" x2="${lx + 18}" y2="${ly}"/><text class="lgd" x="${lx + 23}" y="${ly + 4}">${t}</text>`); lx += 32 + t.length * 12; }
      out.push(`<text class="lgd" x="${lx}" y="${ly + 4}">숫자 = 파괴 순서${CL.events.some((e) => e.cascade) ? ' · 굵은 테두리 = 같은 하중 연쇄' : ''}</text>`);
    } else if (R && !isMech) {
      const items = [['ten', '인장'], ['com', '압축']];
      if (R.frame && R.members.some((q) => q.state === 2)) items.push(['plat', '좌굴 유지']);
      let lx = 14; const ly = H - 40;
      for (const [c, t] of items) {
        out.push(`<line class="mem ${c}" style="stroke-width:3" x1="${lx}" y1="${ly}" x2="${lx + 18}" y2="${ly}"/><text class="lgd" x="${lx + 23}" y="${ly + 4}">${t}</text>`);
        lx += 32 + t.length * 12;
      }

    }
    if (R && !isMech && UI.hoverMem !== null && UI.hoverMem < S.members.length && alive(UI.hoverMem) && !gesture) {
      const k = UI.hoverMem, q = R.members[k], m = S.members[k], a = nm.get(m.a), b = nm.get(m.b);
      const [hx, hy] = toS(...midp(a, b));
      const lines = q.state === 1 ? [`m${k} · 파괴됨`] : [`m${k} · ${q.N > 0 ? '인장' : q.N < 0 ? '압축' : '0'}${q.state === 2 ? ' (좌굴 유지)' : ''}`, `N = ${sigf(q.N, UI.an.digits)} N`, `DCR = ${sigf(q.dcr, UI.an.digits)}`];
      const tw = Math.max(...lines.map((t) => t.length)) * 7.2 + 16, th = lines.length * 16 + 10;
      const tx = Math.min(Math.max(hx + 12, 4), W - tw - 4), ty = Math.min(Math.max(hy - th - 10, 4), H - th - 4);
      out.push(`<g class="tip"><rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="6"/>${lines.map((t, i) => `<text x="${tx + 8}" y="${ty + 19 + i * 16}">${esc(t)}</text>`).join('')}</g>`);
    }
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = out.join('');
}

function supportGlyph(px, py, sx, sy) {
  const g = [];
  if (sx && sy) {
    g.push(`<polygon class="sup" points="${px},${py + 5} ${px - 11},${py + 22} ${px + 11},${py + 22}"/>`);
    g.push(`<line class="gnd" x1="${px - 16}" y1="${py + 22}" x2="${px + 16}" y2="${py + 22}"/>`);
    for (let i = -14; i <= 10; i += 6) g.push(`<line class="hat" x1="${px + i}" y1="${py + 28}" x2="${px + i + 5}" y2="${py + 22}"/>`);
  } else if (sy) {
    g.push(`<polygon class="sup" points="${px},${py + 5} ${px - 11},${py + 19} ${px + 11},${py + 19}"/>`);
    g.push(`<circle class="sup" cx="${px - 5}" cy="${py + 23}" r="3.2"/><circle class="sup" cx="${px + 5}" cy="${py + 23}" r="3.2"/>`);
    g.push(`<line class="gnd" x1="${px - 16}" y1="${py + 27}" x2="${px + 16}" y2="${py + 27}"/>`);
  } else {
    g.push(`<polygon class="sup" points="${px - 5},${py} ${px - 19},${py - 11} ${px - 19},${py + 11}"/>`);
    g.push(`<circle class="sup" cx="${px - 23}" cy="${py - 5}" r="3.2"/><circle class="sup" cx="${px - 23}" cy="${py + 5}" r="3.2"/>`);
    g.push(`<line class="gnd" x1="${px - 27}" y1="${py - 16}" x2="${px - 27}" y2="${py + 16}"/>`);
  }
  return g.join('');
}

/* ======================= hit testing ======================= */
const R_NODE = coarse ? 18 : 11, R_MEM = coarse ? 13 : 7;
function hitNode(px, py) {
  let best = null, bd = R_NODE;
  for (const n of S.nodes) {
    const [x, y] = toS(...wp(n));
    const d = Math.hypot(x - px, y - py);
    if (d < bd) { bd = d; best = n.uid; }
  }
  return best;
}
function hitMember(px, py) {
  const nm = nmap();
  let best = null, bd = R_MEM;
  for (const m of S.members) {
    const a = nm.get(m.a), b = nm.get(m.b);
    const [x1, y1] = toS(...wp(a)), [x2, y2] = toS(...wp(b));
    const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
    const t = L2 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / L2)) : 0;
    const d = Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    if (d < bd) { bd = d; best = m.uid; }
  }
  return best;
}

/* ======================= edits ======================= */
function addNodeAt(x, y) {
  const ex = S.nodes.find((n) => Math.abs(n.x - x) < 1e-9 && Math.abs(n.y - y) < 1e-9);
  if (ex) return ex.uid;
  const n = { uid: nuid(), x, y, sx: 0, sy: 0, fx: 0, fy: 0 };
  S.nodes.push(n);
  return n.uid;
}
function hasMember(a, b) { return S.members.some((m) => (m.a === a && m.b === b) || (m.a === b && m.b === a)); }
function deleteNode(uid) {
  S.nodes = S.nodes.filter((n) => n.uid !== uid);
  S.members = S.members.filter((m) => m.a !== uid && m.b !== uid);
  if (UI.pend === uid) UI.pend = null;
  if (UI.sel && UI.sel.uid === uid) UI.sel = null;
}
function deleteMember(uid) {
  S.members = S.members.filter((m) => m.uid !== uid);
  if (UI.sel && UI.sel.uid === uid) UI.sel = null;
}
function deleteSelection() {
  if (!UI.sel) return;
  const s = UI.sel;
  mutate(() => { if (s.type === 'node') deleteNode(s.uid); else deleteMember(s.uid); });
}

/* ======================= pointer input ======================= */
const ptrs = new Map();
let gesture = null; // {kind:'drag'|'pan'|'pinch', ...}
const local = (e) => { const r = svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

svg.addEventListener('pointerdown', (e) => {
  svg.setPointerCapture(e.pointerId);
  const [px, py] = local(e);
  ptrs.set(e.pointerId, { x: px, y: py });
  if (ptrs.size === 2) {
    const [p1, p2] = [...ptrs.values()];
    const mid = [(p1.x + p2.x) / 2, (p1.y + p2.y) / 2];
    gesture = { kind: 'pinch', d0: Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1, s0: UI.view.s, w0: toW(...mid) };
    return;
  }
  if (ptrs.size > 2) return;
  const nodeHit = hitNode(px, py);
  const memHit = nodeHit ? null : hitMember(px, py);
  const [wx, wy] = toW(px, py);
  const sx = snapV(wx), sy = snapV(wy);

  if (UI.tool === 'select') {
    if (nodeHit) {
      UI.sel = { type: 'node', uid: nodeHit };
      const n = nmap().get(nodeHit);
      gesture = { kind: 'drag', uid: nodeHit, pre: snap(), moved: false, ox: n.x - wx, oy: n.y - wy, sx: px, sy: py };
      selectionChanged();
    } else if (memHit) {
      UI.sel = { type: 'member', uid: memHit };
      gesture = { kind: 'pan', sx: px, sy: py, cx: UI.view.cx, cy: UI.view.cy, moved: false, keepSel: true };
      selectionChanged();
    } else {
      gesture = { kind: 'pan', sx: px, sy: py, cx: UI.view.cx, cy: UI.view.cy, moved: false };
    }
  } else if (UI.tool === 'node') {
    if (nodeHit) { UI.sel = { type: 'node', uid: nodeHit }; selectionChanged(); }
    else { let id; mutate(() => { id = addNodeAt(sx, sy); UI.sel = { type: 'node', uid: id }; }); }
    gesture = { kind: 'pan', sx: px, sy: py, cx: UI.view.cx, cy: UI.view.cy, moved: false, keepSel: true };
  } else if (UI.tool === 'member') {
    if (nodeHit) {
      if (!UI.pend) { UI.pend = nodeHit; draw(); }
      else if (UI.pend === nodeHit) { UI.pend = null; draw(); }
      else if (hasMember(UI.pend, nodeHit)) { toast('이미 연결된 두 절점입니다'); UI.pend = nodeHit; draw(); }
      else { const a = UI.pend; mutate(() => { S.members.push({ uid: nuid(), a, b: nodeHit, ov: null }); UI.pend = nodeHit; }); }
    } else {
      mutate(() => {
        const id = addNodeAt(sx, sy);
        if (UI.pend && UI.pend !== id && !hasMember(UI.pend, id)) S.members.push({ uid: nuid(), a: UI.pend, b: id, ov: null });
        UI.pend = id;
      });
    }
    gesture = { kind: 'pan', sx: px, sy: py, cx: UI.view.cx, cy: UI.view.cy, moved: true, keepSel: true };
  } else if (UI.tool === 'delete') {
    if (nodeHit) mutate(() => deleteNode(nodeHit));
    else if (memHit) mutate(() => deleteMember(memHit));
    gesture = { kind: 'pan', sx: px, sy: py, cx: UI.view.cx, cy: UI.view.cy, moved: true, keepSel: true };
  }
});

svg.addEventListener('pointermove', (e) => {
  const [px, py] = local(e);
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: px, y: py });
  const [wx, wy] = toW(px, py);
  $('#coord').textContent = `x ${fmt(snapV(wx), 1)} · y ${fmt(snapV(wy), 1)} mm`;

  if (gesture && gesture.kind === 'pinch' && ptrs.size >= 2) {
    const [p1, p2] = [...ptrs.values()];
    const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    const s = clampS(gesture.s0 * d / gesture.d0);
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    UI.view.s = s;
    UI.view.cx = gesture.w0[0] - (mx - vw() / 2) / s;
    UI.view.cy = gesture.w0[1] + (my - vh() / 2) / s;
    schedule();
    return;
  }
  if (gesture && gesture.kind === 'drag') {
    const nx = snapV(wx + gesture.ox), ny = snapV(wy + gesture.oy);
    const n = nmap().get(gesture.uid);
    if (n && (n.x !== nx || n.y !== ny)) {
      if (!gesture.moved && Math.hypot(px - gesture.sx, py - gesture.sy) < 3) return;
      if (!gesture.moved) { hist.undo.push(gesture.pre); hist.redo = []; gesture.moved = true; }
      n.x = nx; n.y = ny;
      schedule(); scheduleSide();
    }
    return;
  }
  if (gesture && gesture.kind === 'pan') {
    const dx = px - gesture.sx, dy = py - gesture.sy;
    if (!gesture.moved && Math.hypot(dx, dy) < 4) return;
    gesture.moved = true;
    UI.view.cx = gesture.cx - dx / UI.view.s;
    UI.view.cy = gesture.cy + dy / UI.view.s;
    schedule();
    return;
  }
  // hover
  if (UI.tab === 'analysis' && UI.tool === 'select') {
    const h = hitMember(px, py);
    const k = h ? S.members.findIndex((m) => m.uid === h) : -1;
    const nv = k >= 0 ? k : null;
    if (nv !== UI.hoverMem) { UI.hoverMem = nv; schedule(); }
  }
  if (UI.tool === 'node' || UI.tool === 'member') {
    const h = hitNode(px, py);
    UI.hover = { x: snapV(wx), y: snapV(wy), node: h };
    schedule();
  }
});

function endPointer(e) {
  ptrs.delete(e.pointerId);
  if (gesture && gesture.kind === 'pinch') { if (ptrs.size < 2) { gesture = null; changed(); } return; }
  if (!gesture) return;
  const g = gesture; gesture = null;
  if (g.kind === 'drag' && g.moved) changed();
  else if (g.kind === 'pan') {
    if (!g.moved && UI.tool === 'select' && !g.keepSel && UI.sel) { UI.sel = null; selectionChanged(); }
    persist();
  }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('pointerleave', () => { if (!gesture) { UI.hover = null; UI.hoverMem = null; schedule(); } });

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const [px, py] = local(e);
  const before = toW(px, py);
  UI.view.s = clampS(UI.view.s * Math.exp(-e.deltaY * 0.0015));
  const after = toW(px, py);
  UI.view.cx += before[0] - after[0];
  UI.view.cy += before[1] - after[1];
  schedule();
  clearTimeout(endPointer.t); endPointer.t = setTimeout(persist, 300);
}, { passive: false });

/* ======================= keyboard ======================= */
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (UI.tab === 'analysis' && UI.step !== null && (k === 'arrowleft' || k === 'arrowright')) {
    const c = collapse();
    const cur = typeof UI.step === 'number' ? UI.step : -1;
    if (c && c.ok) { e.preventDefault(); stopPlay(); UI.step = Math.max(0, Math.min(c.frames.length - 1, cur + (k === 'arrowright' ? 1 : -1))); renderAnalysis(); draw(); }
    return;
  }
  if (UI.tab === 'analysis' && UI.step !== null && k === 'escape') { stopPlay(); UI.step = null; renderAnalysis(); draw(); return; }
  if (k === 'v') setTool('select');
  else if (k === 'n') setTool('node');
  else if (k === 'm') setTool('member');
  else if (k === 'd') setTool('delete');
  else if (k === 'f') fit();
  else if (k === 'delete' || k === 'backspace') { e.preventDefault(); deleteSelection(); }
  else if (k === 'escape') { UI.pend = null; UI.sel = null; selectionChanged(); }
});

/* ======================= toolbar ======================= */

  node: '빈 곳을 누르면 격자에 맞춰 절점이 생깁니다.',

  delete: '누른 절점(연결된 부재 포함)이나 부재를 지웁니다.',
};
function setTool(t) {

$('#grid').addEventListener('change', (e) => { UI.grid = +e.target.value; draw(); persist(); });
$('#labels').addEventListener('change', (e) => { UI.labels = e.target.value; draw(); persist(); });
$('#fit').addEventListener('click', fit);
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);

/* ======================= tabs ======================= */
function setTab(t) {
  UI.tab = t;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  for (const id of ['props', 'mat', 'preset', 'analysis', 'export']) $('#pane-' + id).hidden = id !== t;
  renderSide(); draw(); persist();
}
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));

/* ======================= side panel ======================= */
let sideRaf = 0;
const scheduleSide = () => { if (!sideRaf) sideRaf = requestAnimationFrame(() => { sideRaf = 0; renderSide(); }); };

function selectionChanged() {
  if (UI.tab === 'analysis' && UI.step === 'all' && UI.sel && UI.sel.type === 'member') {
    const c = collapse(), k = S.members.findIndex((m) => m.uid === UI.sel.uid);
    const ei = c && c.ok ? c.events.findIndex((e) => e.member === k) : -1;
    if (ei >= 0) UI.step = c.frames.findIndex((f) => f.kind === 'event' && f.ev === ei);
  }
  draw();
  if (UI.sel && UI.tab !== 'props' && UI.tab !== 'analysis') setTab('props'); else renderSide();
}

function changed() {
  const nm = nmap();
  stopPlay(); UI.step = null;
  if (UI.sel && UI.sel.type === 'node' && !nm.has(UI.sel.uid)) UI.sel = null;
  if (UI.sel && UI.sel.type === 'member' && !S.members.some((m) => m.uid === UI.sel.uid)) UI.sel = null;
  draw(); renderStats(); renderSide(); persist();
  $('#undo').disabled = !hist.undo.length;
  $('#redo').disabled = !hist.redo.length;
}

function renderStats() {
  const r = inspect();
  const dl = degLabel(r.deg, r.j);
  const bad = r.issues.some((i) => i.sev === 'bad');
  $('#stats').innerHTML =
    `<span class="chip"><b>j</b>${r.j}</span>` +
    `<span class="chip"><b>m</b>${r.m}</span>` +
    `<span class="chip"><b>r</b>${r.r}</span>` +
    `<span class="chip" data-state="${dl.st}" title="m + r − 2j (필요조건)"><b>m+r−2j</b>${r.j ? r.deg : '—'} · ${dl.t}</span>` +
    `<span class="chip"><b>질량</b>${Number.isFinite(r.mass) ? fmt(r.mass, 3) + ' g' : '—'}</span>` +
    `<span class="chip" data-state="${bad ? 'bad' : r.issues.length ? 'warn' : 'ok'}"><b>검사</b>${bad ? '오류' : r.issues.length ? '주의 ' + r.issues.length : '통과'}</span>` +
    (() => {
      const a = analysis();
      if (!a || a.status === 'empty' || a.status === 'blocked' || a.status === 'big') return '';
      if (a.status === 1) return `<span class="chip" data-state="bad"><b>해석</b>메커니즘</span>`;
      return `<button class="chip chip-btn" id="chip-an" title="해석 탭 열기"><b>P<sub>fail</sub></b>${sigf(a.Pfail, 4)} N</button><button class="chip chip-btn" id="chip-eta" title="해석 탭 열기"><b>η</b>${sigf(a.eta, 4)} N/g</button>`;
    })();
  ['#chip-an', '#chip-eta'].forEach((id) => { const el = $(id); if (el) el.addEventListener('click', () => setTab('analysis')); });
}

function renderSide() {
  if (UI.tab === 'props') renderProps();
  else if (UI.tab === 'mat') renderMat();
  else if (UI.tab === 'preset') renderPreset();

}

function field(id, label, value, attrs = '') {
  const im = /inputmode=/.test(attrs) ? '' : 'inputmode="decimal" ';
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" ${im}value="${esc(value)}" ${attrs}></div>`;
}
function selectField(id, label, opts, value, attrs = '') {
  return `<div class="field"><label for="${id}">${label}</label><select id="${id}" ${attrs}>${Object.entries(opts).map(([k, v]) => `<option value="${k}"${k === value ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></div>`;
}
const issuesHTML = (issues) => issues.length
  ? `<ul class="issues">${issues.map((i) => `<li data-sev="${i.sev}">${esc(i.t)}</li>`).join('')}</ul>`

        <dt>기울기 각</dt><dd>${L ? fmt(Math.atan2(nb.y - na.y, nb.x - na.x) * 180 / Math.PI, 6) + '°' : '—'}</dd>
        <dt>단면적 A</dt><dd>${p.A} mm²</dd>

        <dt>E</dt><dd>${fmt(p.E, 1)} MPa</dd>
        <dt>질량</dt><dd>${Number.isFinite(p.A) ? fmt(p.rho * p.A * L / 1000, 4) + ' g' : '—'}</dd>

    $('#m-ov').addEventListener('change', (e) => mutate(() => {

    ${field('meta-name', '설계 이름', S.meta.name || 'truss', 'inputmode="text"')}
    <dl class="readout">

function matSecForm(scope, root) {
  const m = root.mat, s = root.sec, sp = secProps(s);
  const r = Number.isFinite(sp.A) ? Math.sqrt(sp.I / sp.A) : NaN;
  const P = scope;
  const shapeFields = {
    tube: field(`${P}-sec-d_o`, '외경 d₀ (mm)', s.d_o, 'data-k="sec.d_o"') + field(`${P}-sec-t`, '벽두께 t (mm)', s.t, 'data-k="sec.t"'),
    rod: field(`${P}-sec-d`, '지름 d (mm)', s.d, 'data-k="sec.d"'),
    square: field(`${P}-sec-b`, '한 변 b (mm)', s.b, 'data-k="sec.b"'),
    custom: field(`${P}-sec-A`, 'A (mm²)', s.A, 'data-k="sec.A"') + field(`${P}-sec-I`, 'I (mm⁴)', s.I, 'data-k="sec.I"'),
  }[s.shape];
  return `
    <div class="sec">
      ${matSelectField(`${P}-mat-preset`, m.preset, 'data-k="mat.preset"')}
      ${field(`${P}-mat-E`, '탄성계수 E (MPa)', m.E, 'data-k="mat.E"')}
      ${field(`${P}-mat-rho`, '밀도 ρ (g/cm³)', m.rho, 'data-k="mat.rho"')}
      ${field(`${P}-mat-st`, '인장강도 σₜ (MPa)', m.st, 'data-k="mat.st"')}
      ${field(`${P}-mat-sc`, '압축강도 σ꜀ (MPa)', m.sc, 'data-k="mat.sc"')}
      <dl class="readout">
        <dt>비강성 E/ρ</dt><dd>${fmt(m.E / m.rho, 4)} MPa·cm³/g</dd>
        <dt>비강도 σ꜀/ρ</dt><dd>${fmt(m.sc / m.rho, 4)} MPa·cm³/g</dd>
        <dt>좌굴↔압괴 경계 KL/r</dt><dd>${fmt(Math.PI * Math.sqrt(m.E / m.sc), 4)}</dd>
      </dl>
      <p class="note">목록 값은 문헌 대표값이며 등급·제조사·함수율에 따라 크게 다릅니다(금속은 항복강도). 실제 재료를 쓰면 측정값으로 고쳐 넣으세요. 세장비 KL/r이 경계보다 크면 좌굴, 작으면 압괴가 먼저입니다.</p>
    </div>
    <div class="sec">
      ${selectField(`${P}-sec-shape`, '단면', SHAPES, s.shape, 'data-k="sec.shape"')}
      ${shapeFields}
      <dl class="readout">
        <dt>A</dt><dd>${sp.err ? '<span style="color:var(--bad)">' + esc(sp.err) + '</span>' : fmt(sp.A, 4) + ' mm²'}</dd>
        <dt>I</dt><dd>${sp.err ? '—' : fmt(sp.I, 4) + ' mm⁴'}</dd>
        <dt>r = √(I/A)</dt><dd>${fmt(r, 4)} mm</dd>
      </dl>
    </div>
    <div class="sec">
      ${field(`${P}-K`, '유효길이계수 K', root.K, 'data-k="K"')}
    </div>`;
}
function bindMatSec(pane, scope, getRoot) {
  pane.querySelectorAll(`[id^="${scope}-"][data-k]`).forEach((el) => el.addEventListener('change', () => {
    const key = el.dataset.k;
    const root = getRoot();
    if (key === 'mat.preset') {
      mutate(() => { root.mat.preset = el.value; const p = MATERIALS[el.value]; if (p.E) Object.assign(root.mat, { E: p.E, rho: p.rho, st: p.st, sc: p.sc }); });
      return;
    }
    if (key === 'sec.shape') {
      mutate(() => {
        const cur = secProps(root.sec);
        root.sec.shape = el.value;
        if (el.value === 'custom' && !cur.err) { root.sec.A = num(cur.A); root.sec.I = num(cur.I); }
      });
      return;
    }
    const v = evalExpr(el.value);
    if (!Number.isFinite(v)) { toast('숫자나 식을 입력하세요. 예: 600/7, 100*sqrt(2)'); renderSide(); return; }
    mutate(() => {
      if (key === 'K') root.K = v;
      else {
        const [o, p] = key.split('.');
        root[o][p] = v;
        if (o === 'mat') root.mat.preset = 'custom';
      }
    });
  }));
}

    <div class="sec">

      <p class="note">E = 1630 MPa (실측), 외경 5 mm, 벽두께 0.1366 mm (빨대 질량 0.34 g에서 계산) → A ≈ 2.087 mm², I ≈ 6.175 mm⁴. 엔진 검증용 truss.txt는 문헌값(E 1500, 외경 6 mm) 기준이므로, 정답 대조를 할 때는 적용하지 마세요.</p>

function thumb(kind) {

/* ======================= paper output: figure, tables, zip ======================= */
const FIG_FONT = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Nanum Gothic',sans-serif";
// ov = 붕괴 해석 결과를 주면 '연쇄 파괴 순서' 그림을 만든다
function figureSVG(r, ov) {
  const D = UI.an.digits, mono = UI.an.mono;
  const evOf = ov ? (k) => ov.events.findIndex((e) => e.member === k) : () => -1;
  const C = mono
    ? { ten: '#000', com: '#000', zero: '#888', def: '#666', acc: '#000', load: '#000', rx: '#000', ink: '#000', muted: '#555', comDash: '11 5' }
    : { ten: '#1f5fa8', com: '#c0392b', zero: '#8b979e', def: '#7a868d', acc: '#c26a00', load: '#b3261e', rx: '#24724a', ink: '#1b2328', muted: '#5b6870', comDash: 'none' };
  const nm = nmap(), idx = nodeIndex();
  const sc = ov ? 0 : defScale(r);
  const pts = S.nodes.map((n, i) => [n.x, n.y, n.x + sc * r.ux[i], n.y + sc * r.uy[i]]);
  const useDef = !ov && sc > 0;
  const fw = (n) => { if (!useDef) return [n.x, n.y]; const i = idx.get(n.uid); return [n.x + sc * r.ux[i], n.y + sc * r.uy[i]]; };
  const FC = mono ? ['#000', '#000', '#000'] : ['#1f5fa8', '#c0392b', '#c98a12'];      // 인장 파단, 좌굴, 압괴
  const FD = mono ? ['14 6', 'none', '4 4'] : ['none', 'none', 'none'];
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const [a, b, c, d] of pts) { x0 = Math.min(x0, a, c); x1 = Math.max(x1, a, c); y0 = Math.min(y0, b, d); y1 = Math.max(y1, b, d); }
  const hasLoadUp = S.nodes.some((n) => n.fy < 0 || n.fx);   // 아래로 누르는 하중 화살표는 절점 위로 나온다
  const W = 1600, mx = 130, top = hasLoadUp ? 140 : 80, bot = 200;
  const k = Math.min((W - 2 * mx) / Math.max(x1 - x0, 1e-9), 1000 / Math.max(y1 - y0, 1e-9));
  const H = Math.round(top + (y1 - y0) * k + bot);
  const ox = (W - (x1 - x0) * k) / 2;
  const T = (x, y) => [ox + (x - x0) * k, top + (y1 - y) * k];
  const f1 = (v) => v.toFixed(1);
  const nMax = Math.max(...r.members.map((q) => Math.abs(q.N)), 0);
  const o = [];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${FIG_FONT}">`);
  o.push(`<style>.sup{fill:#fff;stroke:${C.ink};stroke-width:2;stroke-linejoin:round}.gnd{stroke:${C.ink};stroke-width:2}.hat{stroke:${C.muted};stroke-width:1.3}text{font-family:${FIG_FONT}}</style>`);
  o.push(`<rect width="${W}" height="${H}" fill="#fff"/>`);
  // critical halo
  if (r.critical >= 0 && !ov) {
    const m = S.members[r.critical], a = nm.get(m.a), b = nm.get(m.b);
    const [ax, ay] = T(...fw(a)), [bx, by] = T(...fw(b));
    o.push(`<line x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}" stroke="${C.acc}" stroke-opacity="${mono ? 0.18 : 0.3}" stroke-width="22" stroke-linecap="round"/>`);
  }
  // members
  S.members.forEach((m, kk) => {
    const a = nm.get(m.a), b = nm.get(m.b), q = r.members[kk];
    const [ax, ay] = T(...fw(a)), [bx, by] = T(...fw(b));
    if (ov) {
      const ei = evOf(kk);
      if (ei < 0) o.push(`<line x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}" stroke="${mono ? '#999' : '#a7b1b7'}" stroke-width="2.4" stroke-linecap="round"/>`);
      else { const md = ov.events[ei].mode; o.push(`<line x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}" stroke="${FC[md]}" stroke-width="8" stroke-linecap="${FD[md] === 'none' ? 'round' : 'butt'}" stroke-dasharray="${FD[md]}"/>`); }
      return;
    }
    const zero = ZERO_N(q.N, nMax);
    const col = zero ? C.zero : q.N > 0 ? C.ten : C.com;
    const w = zero ? 1.6 : 2.2 + 6.8 * Math.abs(q.N) / (nMax || 1);
    const dash = zero ? 'none' : q.N < 0 ? C.comDash : 'none';
    o.push(`<line x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}" stroke="${col}" stroke-width="${w.toFixed(2)}" stroke-linecap="${dash === 'none' ? 'round' : 'butt'}" stroke-dasharray="${dash}"/>`);
  });
  // supports
  for (const n of S.nodes) if (n.sx || n.sy) { const [px, py] = T(...fw(n)); o.push(supportGlyph(px, py, n.sx, n.sy)); }
  // loads
  for (const n of S.nodes) {
    if (!n.fx && !n.fy) continue;
    const [px, py] = T(...fw(n)), mag = Math.hypot(n.fx, n.fy), dx = n.fx / mag, dy = -n.fy / mag;
    const tipX = px - dx * 10, tipY = py - dy * 10, tailX = tipX - dx * 62, tailY = tipY - dy * 62, hx = tipX - dx * 14, hy = tipY - dy * 14, ux = -dy * 7, uy = dx * 7;
    o.push(`<line x1="${f1(tailX)}" y1="${f1(tailY)}" x2="${f1(hx)}" y2="${f1(hy)}" stroke="${C.load}" stroke-width="3"/><polygon points="${f1(tipX)},${f1(tipY)} ${f1(hx + ux)},${f1(hy + uy)} ${f1(hx - ux)},${f1(hy - uy)}" fill="${C.load}"/>`);
    const lbl = n.fx && n.fy ? `(${sigf(n.fx, D)}, ${sigf(n.fy, D)}) N` : `P = ${sigf(mag, D)} N`;
    o.push(`<text x="${f1(tailX + 10)}" y="${f1(tailY - 4)}" font-size="22" font-weight="600" fill="${C.load}" paint-order="stroke" stroke="#fff" stroke-width="5">${esc(lbl)}</text>`);
  }
  // reactions
  if (UI.an.react && !ov) {
    S.nodes.forEach((n, i) => {
      const [px, py] = T(...fw(n));
      [[n.sx, r.rx[i], 0], [n.sy, 0, r.ry[i]]].forEach(([fixed, fx, fy]) => {
        const mag = Math.hypot(fx, fy);
        if (!fixed || !(mag > 1e-9 * Math.max(1, nMax))) return;
        const dx = fx / mag, dy = -fy / mag;
        const tipX = px - dx * 46, tipY = py - dy * 46, tailX = tipX - dx * 44, tailY = tipY - dy * 44, hx = tipX - dx * 12, hy = tipY - dy * 12, ux = -dy * 6, uy = dx * 6;
        o.push(`<line x1="${f1(tailX)}" y1="${f1(tailY)}" x2="${f1(hx)}" y2="${f1(hy)}" stroke="${C.rx}" stroke-width="2.6"/><polygon points="${f1(tipX)},${f1(tipY)} ${f1(hx + ux)},${f1(hy + uy)} ${f1(hx - ux)},${f1(hy - uy)}" fill="${C.rx}"/>`);
        o.push(`<text x="${f1(tailX + (fx ? 0 : 10))}" y="${f1(tailY + (fx ? -10 : 20))}" text-anchor="${fx ? 'middle' : 'start'}" font-size="20" fill="${C.rx}" paint-order="stroke" stroke="#fff" stroke-width="5">${sigf(mag, D)} N</text>`);
      });
    });
  }
  // nodes
  for (const n of S.nodes) { const [px, py] = T(...fw(n)); o.push(`<circle cx="${f1(px)}" cy="${f1(py)}" r="6" fill="#fff" stroke="${C.ink}" stroke-width="2.4"/>`); }
  if (UI.an.nodes) S.nodes.forEach((n, i) => { const [px, py] = T(...fw(n)); o.push(`<text x="${f1(px + 9)}" y="${f1(py - 11)}" font-size="17" fill="${C.muted}" paint-order="stroke" stroke="#fff" stroke-width="4">${i}</text>`); });
  // failure-order badges
  if (ov) ov.events.forEach((e, i) => {
    const m = S.members[e.member], a = nm.get(m.a), b = nm.get(m.b);
    const [ax, ay] = T(...fw(a)), [bx, by] = T(...fw(b));
    const cx = (ax + bx) / 2, cy = (ay + by) / 2;
    o.push(`<circle cx="${f1(cx)}" cy="${f1(cy)}" r="19" fill="#fff" stroke="${FC[e.mode]}" stroke-width="${e.cascade ? 6 : 3}"/><text x="${f1(cx)}" y="${f1(cy + 8)}" text-anchor="middle" font-size="22" font-weight="700" fill="${C.ink}">${i + 1}</text>`);
  });
  // member labels
  if (UI.an.show !== 'none' && !ov) {
    S.members.forEach((m, kk) => {
      const a = nm.get(m.a), b = nm.get(m.b), q = r.members[kk];
      const [ax, ay] = T(...fw(a)), [bx, by] = T(...fw(b));
      const len = Math.hypot(bx - ax, by - ay);
      if (len < 70) return;
      const zero = ZERO_N(q.N, nMax);
      const col = zero ? C.muted : q.N > 0 ? C.ten : C.com;
      const t = UI.an.show === 'N' ? (zero ? '0' : sigf(q.N, D)) : UI.an.show === 'dcr' ? sigf(q.dcr, D) : 'm' + kk;
      let nx = -(by - ay) / len, ny = (bx - ax) / len; if (ny > 0) { nx = -nx; ny = -ny; }   // 부재 위쪽 법선
      const tw = t.length * 11;                                   // 글자 폭 추정 (20px 숫자)
      const off = 8 + 3.4 + 4.5 * Math.abs(q.N) / (nMax || 1) + Math.abs(nx) * tw / 2 + Math.abs(ny) * 8;
      o.push(`<text x="${f1((ax + bx) / 2 + nx * off)}" y="${f1((ay + by) / 2 + ny * off + 7)}" text-anchor="middle" font-size="20" font-weight="600" fill="${col}" paint-order="stroke" stroke="#fff" stroke-width="6">${t}</text>`);
    });
  }
  if (r.critical >= 0 && !ov) {
    const m = S.members[r.critical], a = nm.get(m.a), b = nm.get(m.b);
    const [ax, ay] = T(...fw(a)), [bx, by] = T(...fw(b));
    const len = Math.hypot(bx - ax, by - ay) || 1;
    let nx = -(by - ay) / len, ny = (bx - ax) / len; if (ny > 0) { nx = -nx; ny = -ny; }
    const off = (UI.an.show !== 'none' ? 46 : 20) + 95 * Math.abs(nx);
    o.push(`<text x="${f1((ax + bx) / 2 + nx * off)}" y="${f1((ay + by) / 2 + ny * off + 7)}" text-anchor="middle" font-size="20" font-weight="700" fill="${C.acc}" paint-order="stroke" stroke="#fff" stroke-width="6">최초 파괴 m${r.critical} (${MODE_LABEL[r.members[r.critical].mode]})</text>`);
  }
  // legend + scale bar

  return BOM + L.join('\n') + '\n';
}

function copyText(text, okMsg) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let done = false; try { done = document.execCommand('copy'); } catch (e) { done = false; }
    ta.remove(); toast(done ? okMsg : '복사하지 못했습니다');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback);
  else fallback();
}
function membersCSV(r) {
  const L = ['member,i,j,L_mm,N_N,stress_MPa,cap_N,dcr,mode'];
  const idx = nodeIndex(), nm = nmap();
  S.members.forEach((m, k) => {
    const q = r.members[k];
    L.push([k, idx.get(m.a), idx.get(m.b), memLen(m, nm), q.N, q.stress, q.cap, q.dcr, ['tension', 'buckling', 'crushing'][q.mode]].map(String).join(','));
  });
  return L.join('\n') + '\n';
}
