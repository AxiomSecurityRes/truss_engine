/* ======================= export / import ======================= */
const UNITS = { length: 'mm', force: 'N', stress: 'MPa', area: 'mm^2', inertia: 'mm^4', density: 'g/cm^3' };
function exportData() {
  const idx = nodeIndex();
  const nodes = S.nodes.map((n, i) => ({ id: i, x: num(n.x), y: num(n.y), fix_x: n.sx ? 1 : 0, fix_y: n.sy ? 1 : 0, fx: num(n.fx), fy: num(n.fy) }));
  const members = S.members.map((m, k) => {
    const p = memEff(m);
    return { id: k, i: idx.get(m.a), j: idx.get(m.b), E: num(p.E), A: num(p.A), I: num(p.I), rho: num(p.rho), sigma_t: num(p.st), sigma_c: num(p.sc), K: num(p.K) };
  });
  return { nodes, members };
}
function toJSONText(d) {
  const line = (o) => JSON.stringify(o);
  const arr = (a) => (a.length ? '[\n' + a.map((o) => '    ' + line(o)).join(',\n') + '\n  ]' : '[]');
  const c = inspect();
  return '{\n  "format": "truss-v1",\n  "units": ' + line(UNITS) +
    ',\n  "counts": ' + line({ j: c.j, m: c.m, r: c.r, degree: c.deg }) +
    ',\n  "nodes": ' + arr(d.nodes) + ',\n  "members": ' + arr(d.members) +
    ',\n  "editor": ' + snap() + '\n}\n';
}
function toTXT(d) {
  const L = ['TRUSS 1', `${d.nodes.length} ${d.members.length}`];
  for (const n of d.nodes) L.push([n.x, n.y, n.fix_x, n.fix_y, n.fx, n.fy].join(' '));
  for (const m of d.members) L.push([m.i, m.j, m.E, m.A, m.I, m.rho, m.sigma_t, m.sigma_c, m.K].join(' '));
  return L.join('\n') + '\n';
}
const outText = () => (UI.fmt === 'json' ? toJSONText(exportData()) : toTXT(exportData()));

function fromPlain(nodes, members) {
  const j = nodes.length;
  const st = { nodes: [], members: [], mat: defMat(), sec: defSec(), K: 1, meta: { name: 'imported' }, consts: defConsts() };
  let u = 1;
  nodes.forEach((n, i) => {
    if (![n.x, n.y].every((v) => Number.isFinite(+v))) throw new Error(`절점 ${i}의 좌표가 숫자가 아닙니다`);
    st.nodes.push({ uid: u++, x: +n.x, y: +n.y, sx: +n.fix_x ? 1 : 0, sy: +n.fix_y ? 1 : 0, fx: +n.fx || 0, fy: +n.fy || 0 });
  });
  const seenPair = new Set();
  if (members.length) {
    const f = members[0];
    st.mat = { preset: 'custom', E: +f.E, rho: +f.rho, st: +f.sigma_t, sc: +f.sigma_c };
    st.mat.preset = matchPreset(st.mat);
    st.sec = { ...defSec(), shape: 'custom', A: +f.A, I: +f.I };
    st.K = +f.K;
  }
  const same = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  members.forEach((m, k) => {
    const a = +m.i, b = +m.j;
    if (!(Number.isInteger(a) && Number.isInteger(b) && a >= 0 && b >= 0 && a < j && b < j)) throw new Error(`부재 ${k}의 절점 번호(${m.i}, ${m.j})가 범위를 벗어났습니다`);
    if (a === b) throw new Error(`부재 ${k}의 양 끝이 같은 절점(${a})입니다`);
    const pair = Math.min(a, b) + '-' + Math.max(a, b);
    if (seenPair.has(pair)) throw new Error(`부재 ${k}가 앞선 부재와 같은 두 절점(${a}, ${b})을 잇습니다`);
    seenPair.add(pair);
    for (const key of ['E', 'A', 'I', 'rho', 'sigma_t', 'sigma_c', 'K']) if (!(+m[key] > 0)) throw new Error(`부재 ${k}의 ${key} 값이 0보다 크지 않습니다`);
    const differs = !(same(+m.E, st.mat.E) && same(+m.rho, st.mat.rho) && same(+m.sigma_t, st.mat.st) && same(+m.sigma_c, st.mat.sc) && same(+m.A, st.sec.A) && same(+m.I, st.sec.I) && same(+m.K, st.K));
    st.members.push({ uid: u++, a: st.nodes[a].uid, b: st.nodes[b].uid, ov: differs ? { mat: { preset: 'custom', E: +m.E, rho: +m.rho, st: +m.sigma_t, sc: +m.sigma_c }, sec: { ...defSec(), shape: 'custom', A: +m.A, I: +m.I }, K: +m.K } : null });
  });
  return st;
}
function parseImport(txt) {
  txt = txt.trim();
  if (!txt) throw new Error('붙여넣은 내용이 비어 있습니다');
  if (txt[0] === '{') {
    let d;
    try { d = JSON.parse(txt); } catch (e) { throw new Error('JSON 형식이 올바르지 않습니다: ' + e.message); }
    if (d.editor && Array.isArray(d.editor.nodes)) return d.editor;
    if (!Array.isArray(d.nodes) || !Array.isArray(d.members)) throw new Error('nodes와 members 배열이 필요합니다');
    return fromPlain(d.nodes, d.members);
  }
  const tok = txt.split(/\s+/);
  let p = 0;
  const next = () => { if (p >= tok.length) throw new Error('파일이 중간에 끝났습니다'); return tok[p++]; };
  const nextNum = (what) => { const v = Number(next()); if (!Number.isFinite(v)) throw new Error(`${what} 자리에 숫자가 아닌 값이 있습니다`); return v; };
  if (next() !== 'TRUSS') throw new Error('첫 단어가 TRUSS가 아닙니다');
  next();
  const j = nextNum('절점 수'), m = nextNum('부재 수');
  if (!Number.isInteger(j) || !Number.isInteger(m) || j < 0 || m < 0) throw new Error('절점 수와 부재 수는 0 이상의 정수여야 합니다');
  const nodes = [], members = [];
  for (let i = 0; i < j; i++) nodes.push({ x: nextNum(`절점 ${i} x`), y: nextNum(`절점 ${i} y`), fix_x: nextNum('fix_x'), fix_y: nextNum('fix_y'), fx: nextNum('fx'), fy: nextNum('fy') });
  for (let k = 0; k < m; k++) members.push({ i: nextNum(`부재 ${k} i`), j: nextNum(`부재 ${k} j`), E: nextNum('E'), A: nextNum('A'), I: nextNum('I'), rho: nextNum('rho'), sigma_t: nextNum('sigma_t'), sigma_c: nextNum('sigma_c'), K: nextNum('K') });
  return fromPlain(nodes, members);
}

// downloads: inside the claude.ai viewer use the capability; opened as a local file, fall back to a normal download
const inViewer = !!(window.claude && window.claude.use);
let dlNS = inViewer ? undefined : null;
if (inViewer) window.claude.use('downloads').then((d) => { dlNS = d; if (['export', 'analysis', 'preset'].includes(UI.tab)) renderSide(); }).catch(() => { dlNS = null; if (['export', 'analysis', 'preset'].includes(UI.tab)) renderSide(); });
async function saveFile(name, data) {
  const text = data;
  if (inViewer) {
    if (!dlNS) { toast('이 화면에서는 파일 저장을 쓸 수 없습니다. 복사해서 붙여넣으세요.'); return; }
    try { await dlNS.save({ filename: name, data: text }); toast(name + ' 저장을 요청했습니다'); }
    catch (e) {
      if (e && e.code === 'declined') toast('저장을 취소했습니다');
      else if (e && e.code === 'rate_limited') toast('저장 창이 이미 열려 있습니다');
      else toast('저장하지 못했습니다. 복사해서 붙여넣으세요.');
    }
    return;
  }
  const MIME = { json: 'application/json', csv: 'text/csv', svg: 'image/svg+xml', png: 'image/png', zip: 'application/zip', html: 'text/html' };
  const blob = text instanceof Blob ? text : new Blob([text], { type: MIME[name.split('.').pop()] || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(name + '을(를) 저장했습니다');
}

// 엔진의 readTruss가 거부할 입력: 이런 파일은 아예 만들지 않는다.
function exportBlockers() {
  const nm = nmap(), out = [];
  const badVal = [], zero = [];
  S.members.forEach((m, k) => {
    const p = memEff(m);
    if (![p.E, p.A, p.I, p.rho, p.st, p.sc, p.K].every((v) => Number.isFinite(v) && v > 0)) badVal.push(k);
    if (memLen(m, nm) === 0) zero.push(k);
  });
  const list = (a) => a.slice(0, 6).map((k) => 'm' + k).join(', ') + (a.length > 6 ? ' 외' : '');
  if (badVal.length) out.push(`재료·단면 값이 0 이하이거나 계산되지 않는 부재: ${list(badVal)}`);
  if (zero.length) out.push(`길이가 0인 부재: ${list(zero)}`);
  return out;
}

function renderExport() {
  const pane = $('#pane-export');
  const r = inspect();
  const blockers = exportBlockers();
  const fname = (S.meta.name || 'truss') + (UI.fmt === 'json' ? '.json' : '.txt');
  const canSave = !inViewer || dlNS !== null;
  pane.innerHTML = `
    <div class="title-row"><h3>엔진 입력 내보내기</h3><span class="sub">${esc(fname)}</span></div>
    ${blockers.length
      ? `<div class="sec"><h2>내보낼 수 없습니다</h2><ul class="issues">${blockers.map((t) => `<li data-sev="bad">${esc(t)}</li>`).join('')}</ul><p class="note">엔진이 읽지 못하는 값입니다. 재료·단면 탭이나 해당 부재를 고치면 다시 내보낼 수 있습니다.</p></div>`
      : r.issues.some((i) => i.sev === 'bad') ? `<div class="sec"><h2>내보내기 전에 확인할 것</h2>${issuesHTML(r.issues)}<p class="note">지점·부재 수 문제는 그대로 내보낼 수 있고, 엔진은 Mechanism으로 판정합니다.</p></div>` : ''}
    <div class="row">
      <div class="seg" role="group" aria-label="형식">
        <button data-fmt="json" aria-pressed="${UI.fmt === 'json'}">JSON</button>
        <button data-fmt="txt" aria-pressed="${UI.fmt === 'txt'}">TXT</button>
      </div>
    </div>
    <textarea id="out" readonly spellcheck="false" aria-label="내보낼 내용" placeholder="위 문제를 고치면 여기에 내보낼 내용이 나타납니다">${blockers.length ? '' : esc(outText())}</textarea>
    <div class="row">
      <button class="btn primary" id="copy" ${blockers.length ? 'disabled' : ''}>복사</button>
      ${canSave ? `<button class="btn" id="save" ${dlNS === undefined || blockers.length ? 'disabled' : ''}>파일로 저장</button>` : ''}
    </div>
    <details>
      <summary>형식 설명</summary>
      <div class="spec">
        <p class="note">단위: 길이 mm, 힘 N, 응력·E MPa, A mm², I mm⁴, 밀도 g/cm³. 좌표는 x 오른쪽 +, y 위쪽 +. 절점 번호는 0부터 이어지는 배열 순서입니다. 실수는 double을 그대로 복원하는 가장 짧은 십진 표기로 적습니다(유효숫자 최대 17자리).</p>
        <div class="tblwrap"><table>
          <tr><td>fix_x, fix_y</td><td>1이면 그 방향 구속. 핀 = 1 1, 롤러 = 0 1</td></tr>
          <tr><td>fx, fy</td><td>절점 하중 (N). 아래 방향 하중은 fy &lt; 0</td></tr>
          <tr><td>i, j</td><td>부재 양 끝 절점 번호</td></tr>
          <tr><td>E, A, I</td><td>탄성계수, 단면적, 단면 2차 모멘트</td></tr>
          <tr><td>rho</td><td>밀도. 질량[g] = rho · A · L / 1000</td></tr>
          <tr><td>sigma_t, sigma_c</td><td>인장·압축 강도 (양수)</td></tr>
          <tr><td>K</td><td>유효길이계수 (좌굴)</td></tr>
        </table></div>
        <p class="note">TXT 구조</p>
<pre>TRUSS 1
j m
x y fix_x fix_y fx fy          ← 절점 j줄
i j E A I rho sigma_t sigma_c K ← 부재 m줄</pre>
        <p class="note">JSON의 editor 항목은 이 도면판이 다시 불러올 때만 쓰며, 엔진은 무시해도 됩니다.</p>
      </div>
    </details>
    <div class="sec">
      <h2>불러오기</h2>
      <textarea id="in" spellcheck="false" placeholder="JSON 또는 TXT 내용을 붙여넣으세요" aria-label="불러올 내용" style="min-height:110px"></textarea>
      <div class="row">
        <button class="btn" id="load">붙여넣은 내용 불러오기</button>
        <label class="btn" for="file">파일 선택</label>
        <input type="file" id="file" accept=".json,.txt,application/json,text/plain" hidden>
      </div>
    </div>`;
  pane.querySelectorAll('[data-fmt]').forEach((b) => b.addEventListener('click', () => { UI.fmt = b.dataset.fmt; renderExport(); }));
  $('#copy').addEventListener('click', () => {
    const ta = $('#out'), text = ta.value;
    const fallback = () => { ta.focus(); ta.select(); toast('선택했습니다. Ctrl+C로 복사하세요'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('복사했습니다'), fallback);
    else fallback();
  });
  const sv = $('#save'); if (sv) sv.addEventListener('click', () => saveFile(fname, outText()));
  const doLoad = (text) => {
    try {
      const st = parseImport(text);
      mutate(() => { UI.sel = null; UI.pend = null; restore(st); });
      fit();
      toast(`불러왔습니다: 절점 ${S.nodes.length}, 부재 ${S.members.length}`);
    } catch (e) { toast(e.message); }
  };
  $('#load').addEventListener('click', () => doLoad($('#in').value));
  $('#file').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => doLoad(String(rd.result));
    rd.onerror = () => toast('파일을 읽지 못했습니다');
    rd.readAsText(f);
  });
}

/* ======================= toast ======================= */
let toastT = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ======================= boot ======================= */
function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.state) {
    try {
      restore(saved.state);
      if (saved.view) UI.view = saved.view;
      if (saved.grid !== undefined) UI.grid = saved.grid;
      if (saved.labels) UI.labels = saved.labels;
      if (saved.an) UI.an = { ...UI.an, ...saved.an };
      if (saved.tab && ['props', 'mat', 'preset', 'analysis', 'export'].includes(saved.tab)) UI.tab = saved.tab;
      if (saved.preset) UI.preset = { ...UI.preset, ...saved.preset, tri: { ...UI.preset.tri, ...(saved.preset.tri || {}) } };
    } catch (e) { saved = null; }
  }
  if (!saved || !S) {
    S = { nodes: [], members: [], mat: defMat(), sec: defSec(), K: 1, meta: { name: 'truss' }, consts: defConsts() };
    const p = UI.preset;
    loadGenerated(generate(p.kind, p.n, p.L, p.H, p.P), { name: `${p.kind}_n${p.n}`, preset: p.kind, n: p.n, L: p.L, H: p.H, P: p.P });
  }
  $('#grid').value = String(UI.grid);
  $('#labels').value = UI.labels;
  setTool('select');
  setTab(UI.tab);
  changed();
  const doFit = !saved;
  requestAnimationFrame(() => { if (doFit) fit(); else draw(); });
  new ResizeObserver(() => schedule()).observe(svg.parentElement);
}
boot();
})();
